<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14" />
      <stop offset="100%" stop-color="#0a1324" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2e4f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <text x="500" y="45" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">Zero-Trust Link Aggregation (IEEE 802.1AX) Architecture</text>
  <text x="500" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">800G Data Center Backbone Bundle, 5-Tuple L3+L4 Hash Balancing &amp; Multi-Chassis MLAG</text>

  <!-- Top: Dual Leaf / Spine MLAG Cluster -->
  <rect x="180" y="110" width="300" height="140" rx="10" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="2" />
  <rect x="200" y="125" width="260" height="26" rx="4" fill="url(#leafGrad)" />
  <text x="330" y="143" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Spine / MLAG Peer Switch A</text>
  <text x="330" y="175" fill="#34d399" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">System Priority: 32768</text>
  <text x="330" y="195" fill="#22d3ee" font-family="monospace" font-size="11" text-anchor="middle">Virtual MAC: 00:1A:2B:3C:4D:5E</text>
  <text x="330" y="215" fill="#fbbf24" font-family="monospace" font-size="10" text-anchor="middle">LACP Active Mode | Rate Fast (1s)</text>
  <text x="330" y="235" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">State: 0x3D (Collecting &amp; Distributing)</text>

  <rect x="520" y="110" width="300" height="140" rx="10" fill="url(#nodeGrad)" stroke="#06b6d4" stroke-width="2" />
  <rect x="540" y="125" width="260" height="26" rx="4" fill="url(#leafGrad)" />
  <text x="670" y="143" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Spine / MLAG Peer Switch B</text>
  <text x="670" y="175" fill="#34d399" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">System Priority: 32768</text>
  <text x="670" y="195" fill="#22d3ee" font-family="monospace" font-size="11" text-anchor="middle">Virtual MAC: 00:1A:2B:3C:4D:5E</text>
  <text x="670" y="215" fill="#fbbf24" font-family="monospace" font-size="10" text-anchor="middle">LACP Active Mode | Rate Fast (1s)</text>
  <text x="670" y="235" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">State: 0x3D (Aligned Virtual Pair)</text>

  <!-- MLAG Peer-Link -->
  <line x1="480" y1="180" x2="520" y2="180" stroke="#38bdf8" stroke-width="4" />
  <text x="500" y="170" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">Peer-Link</text>

  <!-- Middle: 8x 100G Port-Channel Trunks -->
  <line x1="280" y1="250" x2="400" y2="350" stroke="#10b981" stroke-width="3" />
  <line x1="310" y1="250" x2="430" y2="350" stroke="#10b981" stroke-width="3" />
  <line x1="340" y1="250" x2="460" y2="350" stroke="#10b981" stroke-width="3" />
  <line x1="370" y1="250" x2="490" y2="350" stroke="#10b981" stroke-width="3" />

  <line x1="630" y1="250" x2="510" y2="350" stroke="#06b6d4" stroke-width="3" />
  <line x1="660" y1="250" x2="540" y2="350" stroke="#06b6d4" stroke-width="3" />
  <line x1="690" y1="250" x2="570" y2="350" stroke="#06b6d4" stroke-width="3" />
  <line x1="720" y1="250" x2="600" y2="350" stroke="#06b6d4" stroke-width="3" />

  <!-- Center Callout: 800G Aggregate Bundle -->
  <rect x="360" y="280" width="280" height="50" rx="8" fill="#040813" stroke="#06b6d4" stroke-width="1.5" />
  <text x="500" y="302" fill="#22d3ee" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">8x 100GbE QSFP28 Bundle</text>
  <text x="500" y="320" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">800 Gbps Aggregate Throughput</text>

  <!-- Bottom: Core Compute / Storage Hypervisor -->
  <rect x="220" y="360" width="560" height="160" rx="10" fill="url(#nodeGrad)" stroke="#1b2b4d" />
  <text x="500" y="390" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Dual-Homed Compute Cluster / Storage Pod</text>
  <text x="500" y="415" fill="#fbbf24" font-family="monospace" font-size="12" text-anchor="middle">Linux bond0 (802.3ad) / Juniper ae0</text>

  <rect x="240" y="435" width="520" height="35" rx="5" fill="#080f1e" stroke="#10b981" />
  <text x="500" y="457" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">5-Tuple L3+L4 Resilient Hash: Zero Polarization Across Flows</text>

  <rect x="240" y="475" width="520" height="35" rx="5" fill="#080f1e" stroke="#10b981" />
  <text x="500" y="497" fill="#22d3ee" font-family="monospace" font-size="11" text-anchor="middle">Min-Links 4: Automatic SLA Protection &amp; &lt;50ms ASIC Failover</text>

  <!-- Bottom Callout: Key Security Rules -->
  <rect x="60" y="545" width="880" height="85" rx="8" fill="#080f1e" stroke="#1b2b4d" />
  <text x="500" y="565" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Zero-Trust Link Aggregation Axioms</text>
  <text x="80" y="588" fill="#34d399" font-family="sans-serif" font-size="10">1. LACP Active mode prevents passive negotiation deadlocks</text>
  <text x="390" y="588" fill="#34d399" font-family="sans-serif" font-size="10">2. Short timeout (1s heartbeat) detects link failure in &lt;50ms</text>
  <text x="700" y="588" fill="#34d399" font-family="sans-serif" font-size="10">3. 5-tuple L3+L4 hash eliminates microburst polarization</text>
  <text x="80" y="612" fill="#34d399" font-family="sans-serif" font-size="10">4. Aligned MLAG System MACs prevent active-active split-brain</text>
  <text x="390" y="612" fill="#34d399" font-family="sans-serif" font-size="10">5. Min-links threshold tears down oversubscribed degraded bundles</text>
  <text x="700" y="612" fill="#34d399" font-family="sans-serif" font-size="10">6. CoPP policers throttle Slow Protocols 01:80:C2:00:00:02 floods</text>
</svg>
